# Motion conversion config for the Unitree G1 (29 DoF) mimic task.
# Consumed by scripts/mimic/csv_to_npz.py and scripts/mimic/batch_csv_to_npz.py.
# Format is aligned with frog_lab's motion_data/config/g1.yaml.
#
# NOTE: relative paths below are resolved against *this file's directory*
#       (motion_data/config), hence the "../motion_tracking/..." prefix.
motion_data:
  robot_name: g1
  root_link_name: pelvis
  root_quat_order: xyzw

  # Default single-file input used by csv_to_npz.py when --csv_path is omitted.
  csv_path: ../motion_tracking/g1/dance1_subject2.csv
  csv_fps: 30

  # Optional multi-file list used by batch_csv_to_npz.py. Entries that also
  # appear in csv_path are de-duplicated, so the default above is not repeated.
  csv_paths:
    - ../motion_tracking/g1/dance1_subject2.csv
    - ../motion_tracking/g1/G1_Take_102.bvh_60hz.csv
    - ../motion_tracking/g1/G1_gangnam_style_V01.bvh_60hz.csv

  # Joint order used by the CSV columns (29 DoF).
  csv_joint_names:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
