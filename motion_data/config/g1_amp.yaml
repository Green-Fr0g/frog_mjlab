# Motion conversion config for Unitree G1 AMP WalkandRun clips.
# Consumed by scripts/mimic/csv_to_npz.py / batch_csv_to_npz.py.
#
# AMP CSV layout matches g1 (29 DoF): root_pos(3)+root_quat_xyzw(4)+joint_pos(29)
# Source frame rate is 120 FPS (see motion_data/amp/g1/MOTION_DATA_FORMAT_zh.md).
motion_data:
  robot_name: g1
  root_link_name: pelvis
  root_quat_order: xyzw

  csv_path: ../amp/g1/walk_forward_loop_002__A022.csv
  csv_fps: 120

  csv_paths:
    - ../amp/g1/arc_jog_left_loop_002__A029.csv
