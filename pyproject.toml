[project]
name = "frog-mjlab"
version = "0.1.0"
description = "G1/H2 locomotion and motion-mimic training tasks built as external extensions of mjlab (frog_lab layout)."
readme = "README.md"
requires-python = ">=3.13"

# The Python packages live under source/ (frog_lab layout):
#   source/frog_mjlab  -> frog_mjlab task package   (pip install -e source/frog_mjlab)
#   source/frog_rl     -> frog_rl algorithm package (pip install -e source/frog_rl)
# Or run directly with: PYTHONPATH="$PWD/source"
