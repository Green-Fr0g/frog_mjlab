[project]
name = "frog-mjlab"
version = "0.1.0"
description = "G1 locomotion training task built as an external extension of mjlab (following the AMP_mjlab pattern)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mjlab==1.2.0",
    "mujoco-warp==3.8.1",
    "warp-lang==1.12.0",
    "scipy==1.17.0",
]

[project.scripts]
frog-mjlab = "frog_mjlab:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
