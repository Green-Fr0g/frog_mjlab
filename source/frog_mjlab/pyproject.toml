[build-system]
requires = ["setuptools>=61.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frog-mjlab"
version = "0.1.0"
description = "G1/H2 locomotion and motion-mimic training tasks built as external extensions of mjlab."
requires-python = ">=3.13"
dependencies = [
    "mjlab",
    "mujoco-warp",
    "warp-lang",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["frog_mjlab*"]

[tool.setuptools.package-data]
"frog_mjlab.tasks.amp.config.g1" = [
    "motions/Recovery/*.npz",
    "motions/WalkandRun/*.npz",
]
"frog_mjlab.tasks.mimic.config.g1" = ["motions/*.npz"]
"frog_mjlab.tasks.mimic.config.g1_23dof" = ["motions/*.npz"]
